name: GTA6 Clips

on:
  schedule:
    - cron: "*/20 * * * *"   # her 20 dakikada (GitHub bazen birkaç dk geciktirir)
  workflow_dispatch:          # telefondan elle başlat
    inputs:
      top:
        description: "Kaç video"
        default: "8"
      lang:
        description: "Dil filtresi (boş=hepsi, tr, en,tr)"
        default: ""
      hours:
        description: "Son kaç saatin klipleri"
        default: "3"

concurrency:
  group: clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py --top "${{ inputs.top || '8' }}" --hours "${{ inputs.hours || '3' }}" --lang "${{ inputs.lang || '' }}"
      - name: Görülen klipleri kaydet
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json 2>/dev/null && git commit -qm "seen" && git push -q || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: out/**/*.mp4
          retention-days: 3
          if-no-files-found: ignore
